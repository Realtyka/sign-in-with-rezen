<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/rezen-logo-black.svg">
<title>Sign in with reZEN — signing in</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="signing">
<div class="wrap">
  <div class="col reveal">
    <img class="brandmark" src="/rezen-logo-black.svg" alt="reZEN">
    <h1 id="headline">Signing in&hellip;</h1>
    <div class="notice">
      <svg class="alert-icon" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path fill="currentColor" d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0Zm0 3.4a.9.9 0 0 1 .9.9v4a.9.9 0 0 1-1.8 0v-4a.9.9 0 0 1 .9-.9Zm0 7.1a1.05 1.05 0 1 1 0 2.1 1.05 1.05 0 0 1 0-2.1Z"/></svg>
      <p id="message" class="message">One moment.</p>
    </div>
    <div class="progress" role="presentation"></div>
    <p class="restart"><a href="/">Start again</a></p>
  </div>
</div>
<script type="module" src="/callback.js"></script>
</body>
</html>
